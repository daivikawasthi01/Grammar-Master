name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholders so env validation passes at build time; nothing external is called.
  MONGODB_URI: mongodb://127.0.0.1:27017/ci
  JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
  GROQ_API_KEY: ci-placeholder

jobs:
  check:
    name: Types, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:ci
      # Route tests run against an in-memory MongoDB (mongodb-memory-server downloads the binary).
      - run: npm run test:ci
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    env:
      E2E_MONGODB_URI: mongodb://127.0.0.1:27017/gm_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: echo "E2E_OUTPUT_DIR=$RUNNER_TEMP/e2e-output" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      # mongo:8 service containers fail on the runners' kernel (6.19+, SERVER-121912), so run an
      # in-memory mongod on the host instead.
      - name: Start MongoDB
        run: |
          nohup node scripts/e2e-mongo.mjs > "$RUNNER_TEMP/mongo.log" 2>&1 &
          for i in $(seq 1 60); do grep -q "mongod ready" "$RUNNER_TEMP/mongo.log" && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/mongo.log"; exit 1
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: ${{ runner.temp }}/e2e-output
