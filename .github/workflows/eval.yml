name: Eval

on:
  workflow_dispatch:
    inputs:
      min_f05:
        description: Fail if mean F0.5 is below this value
        default: "0.25"

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: evals/requirements.txt
      - run: npm ci
      - run: pip install -r evals/requirements.txt && python -m spacy download en_core_web_sm
      # Eval requests are only accepted outside production, so run the dev server.
      - run: npm run dev &
      - run: npx --yes wait-on http://localhost:3000/api/health --timeout 120000
      - run: python evals/run_eval.py --min-f05 ${{ inputs.min_f05 }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: evals/reports/
